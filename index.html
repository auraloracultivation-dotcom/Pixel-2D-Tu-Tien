<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#9fd8f0">
  <title>Pixel 2D Tu Tiên</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/icon/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div class="bars">
      <div class="realm" id="realm"></div>
      <div class="power" id="power"></div>
      <div class="sky" id="sky"></div>
      <div class="bar hp"><i id="hp-fill"></i><span id="hp-text"></span></div>
      <div class="bar qi"><i id="qi-fill"></i><span id="qi-text"></span></div>
      <div class="hud-btns"><button id="btn-mute" aria-label="Bật/tắt tiếng"></button><button id="btn-menu">Menu<i id="menu-badge" hidden></i></button><button id="btn-auto">Tự đánh</button><button id="btn-pilot">Tự hành</button></div>
      <div id="hud-menu" hidden><button id="btn-bag">Túi<i id="bag-badge" hidden></i></button><button id="btn-skills">Chiêu<i id="skills-badge" hidden></i></button><button id="btn-pets">Thú<i id="pets-badge" hidden></i></button><button id="btn-daily">Việc<i id="daily-badge" hidden></i></button><button id="btn-achv">Thành tựu<i id="achv-badge" hidden></i></button><button id="btn-world">Bản đồ</button><button id="btn-social">Đạo hữu<i id="social-badge" hidden></i></button></div>
    </div>
    <div class="goal" id="goal"></div>
    <div class="boss" id="boss" hidden><span id="boss-name"></span><div class="bar"><i id="boss-fill"></i></div></div>
  </div>

  <div id="buttons" hidden>
    <button class="btn act" id="btn-act" data-act="act" hidden></button>
    <button class="btn skill" id="btn-s0" data-act="s0"><span class="cd"></span><b></b></button>
    <button class="btn skill" id="btn-s1" data-act="s1"><span class="cd"></span><b></b></button>
    <button class="btn skill" id="btn-s2" data-act="s2"><span class="cd"></span><b></b></button>
    <button class="btn skill" id="btn-art" data-act="art" hidden><span class="cd"></span><b></b></button>
    <button class="btn dash" id="btn-dash" data-act="dash"><span class="cd"></span><b>Lướt</b></button>
    <button class="btn pill" id="btn-pill" data-act="pill" hidden><span class="cd"></span><b>Đan</b></button>
    <button class="btn atk" id="btn-atk" data-act="atk"><b>Đánh</b></button>
  </div>

  <div id="dialog" hidden>
    <div class="who" id="dlg-who"></div>
    <div class="text" id="dlg-text"></div>
    <div class="choices" id="dlg-choices"></div>
    <div class="hint" id="dlg-hint">Chạm để tiếp ▸</div>
  </div>

  <div id="bag" hidden>
    <div class="bag-head"><b>Túi đồ</b><span id="bag-mats"></span><button id="bag-close" aria-label="Đóng">✕</button></div>
    <div id="bag-equip"></div>
    <div id="bag-stats"></div>
    <div class="bag-tabs"><button data-tab="do">Trang bị</button><button data-tab="ngoc">Ngọc</button><span id="bag-pick" hidden>Chọn ngọc để khảm</span></div>
    <div id="bag-list"></div>
    <div id="bag-detail"></div>
  </div>

  <div id="skills" class="panel" hidden>
    <div class="bag-head"><b>Chiêu thức</b><span class="panel-sub" id="skills-sub"></span><button id="skills-close" aria-label="Đóng">✕</button></div>
    <div class="bag-tabs" id="skills-tabs"><button data-tab="chieu">Chiêu</button><button data-tab="cong-phap">Công pháp</button></div>
    <div id="skills-slots"></div>
    <div id="skills-list"></div>
  </div>

  <div id="cave" class="panel" hidden>
    <div class="bag-head"><b>Động phủ</b><span class="panel-sub" id="cave-mats"></span><button id="cave-close" class="close-x" aria-label="Đóng">✕</button></div>
    <div class="bag-tabs" id="cave-tabs"><button data-tab="dan">Lò đan</button><button data-tab="ren">Lò rèn</button><button data-tab="vuon">Dược viên</button><button data-tab="phu">Động phủ</button></div>
    <div id="cave-slots"></div>
    <div id="cave-msg"></div>
    <div id="cave-list"></div>
  </div>

  <div id="pets" class="panel" hidden>
    <div class="bag-head"><b>Linh thú</b><span class="panel-sub" id="pets-sub"></span><button id="pets-close" aria-label="Đóng">✕</button></div>
    <div class="bag-tabs" id="pets-tabs"><button data-tab="linh-thu">Linh thú</button><button data-tab="thu-cuoi">Thú cưỡi</button><button data-tab="dong-hanh">Đồng hành</button></div>
    <div id="pets-list"></div>
  </div>

  <div id="daily" class="panel" hidden>
    <div class="bag-head"><b>Việc</b><span class="panel-sub" id="daily-sub"></span><button id="daily-close" aria-label="Đóng">✕</button></div>
    <div class="bag-tabs" id="daily-tabs"><button data-tab="ngay">Hằng ngày</button><button data-tab="tong-mon">Tông môn</button><button data-tab="su-kien">Sự kiện</button><button data-tab="tu-hanh">Tự hành</button></div>
    <div id="daily-msg"></div>
    <div id="daily-list"></div>
  </div>

  <div id="achv" class="panel" hidden>
    <div class="bag-head"><b>Thành tựu</b><span class="panel-sub" id="achv-sub"></span><button id="achv-close" aria-label="Đóng">✕</button></div>
    <div class="bag-tabs" id="achv-tabs"><button data-tab="thanh-tuu">Thành tựu</button><button data-tab="danh-hieu">Danh hiệu</button><button data-tab="thoi-trang">Thời trang</button><button data-tab="nhat-ky">Nhật ký</button><button data-tab="so-ca">Sổ cá</button></div>
    <div id="achv-msg"></div>
    <div id="achv-list"></div>
  </div>

  <div id="social" class="panel" hidden>
    <div class="bag-head"><b>Đạo hữu</b><span class="panel-sub" id="social-sub"></span><button id="social-close" aria-label="Đóng">✕</button></div>
    <div class="bag-tabs" id="social-tabs"><button data-tab="chat"></button><button data-tab="world"></button><button data-tab="rank"></button></div>
    <div id="social-rank" hidden><div class="bag-tabs" id="rank-tabs"></div><div id="rank-list"></div><small id="rank-note"></small></div>
    <div id="social-emotes" class="card-acts wrap"></div>
    <div id="social-log"></div>
    <form id="social-form"><input id="social-input" autocomplete="off" enterkeyhint="send"><button class="mini" id="social-send"></button></form>
  </div>

  <div id="market" class="panel" hidden>
    <div class="bag-head"><b id="market-title"></b><span class="panel-sub" id="market-sub"></span><button id="market-close" aria-label="Đóng">✕</button></div>
    <div class="bag-tabs" id="market-tabs"><button data-tab="buy"></button><button data-tab="sell"></button><button data-tab="mine"></button></div>
    <div id="market-list"></div>
    <form id="market-form" hidden><input id="market-n" type="number" min="1" inputmode="numeric"><input id="market-price" type="number" min="1" inputmode="numeric"><button class="mini" id="market-send"></button><small id="market-get"></small></form>
  </div>

  <div id="topup" class="panel" hidden>
    <div class="bag-head"><b id="topup-title"></b><span class="panel-sub" id="topup-sub"></span><button id="topup-close" aria-label="Đóng">✕</button></div>
    <div id="topup-list"></div>
  </div>

  <div id="world" class="panel" hidden>
    <div class="bag-head"><b>Bản đồ</b><span class="panel-sub" id="world-sub"></span><button id="world-close" aria-label="Đóng">✕</button></div>
    <div id="world-sky"></div>
  </div>

  <div id="toast" hidden></div>

  <div id="menu" hidden>
    <h1>Pixel 2D Tu Tiên</h1>
    <p class="sub">Bản chơi tạm</p>
    <div id="login-form" hidden>
      <input id="acc" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="Tài khoản">
      <input id="pwd" type="password" autocomplete="current-password" placeholder="Mật khẩu">
      <div class="row"><button class="menu-btn" id="btn-login">Đăng nhập</button><button class="menu-btn alt" id="btn-signup">Đăng ký</button></div>
    </div>
    <div id="logged" hidden>
      <p class="hello">Đạo hữu <b id="logged-name"></b></p>
      <div id="play-buttons">
        <button class="menu-btn" id="menu-continue" hidden>Chơi tiếp</button>
        <button class="menu-btn" id="menu-new">Bắt đầu</button>
      </div>
      <button class="link-btn" id="btn-logout">Đăng xuất</button>
    </div>
    <p id="login-msg"></p>
    <button class="menu-btn alt" id="btn-guest">Chơi thử (không cần tài khoản)</button>
    <button class="link-btn" id="btn-install" hidden>Cài vào máy</button>
    <p class="help">Kéo nửa trái màn hình để đi. Chạm nút chiêu để tự ngắm, kéo nút chiêu để tự chọn hướng.</p>
  </div>

  <div id="loading">Đang tải...</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
