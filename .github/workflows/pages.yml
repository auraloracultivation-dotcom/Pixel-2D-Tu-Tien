name: Đưa lên GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
      - name: Gom file chạy game
        run: |
          mkdir -p _site
          cp -r index.html privacy.html terms.html xoa-tai-khoan.html legal.css style.css style-khung.css manifest.webmanifest sw.js src data _site/
          [ -d assets ] && cp -r assets _site/ || true
      - name: Gắn số phiên bản để máy không dùng file cũ trong bộ nhớ đệm
        run: |
          V=${GITHUB_SHA::8}
          find _site/src -name '*.js' -exec perl -pi -e "s#((?:from\s+|import\()\s*['\"])(\.{1,2}/[^'\"]+?\.js)(['\"])#\$1\$2?v=$V\$3#g" {} +
          perl -pi -e "s#src/main\.js#src/main.js?v=$V#; s#style\.css#style.css?v=$V#" _site/index.html
          perl -pi -e "s#style-khung\.css#style-khung.css?v=$V#" _site/style.css
          sed -i "s#const BUILD = 'dev'#const BUILD = '$V'#" _site/src/core/data.js
          sed -i "s#const V = 'dev'#const V = '$V'#" _site/sw.js
          grep -c "?v=$V" _site/src/main.js _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
