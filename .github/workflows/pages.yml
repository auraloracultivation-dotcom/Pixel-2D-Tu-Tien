name: Đưa lên GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
      - name: Cài công cụ gói (esbuild, ghim phiên bản)
        run: npm i --no-save esbuild@0.28.2 || echo "không cài được esbuild: tools/goi.mjs sẽ đưa bản chưa gói"
      - name: Gói bản đưa lên (JS vài tệp, dữ liệu một tệp, CSS gộp, gắn số phiên bản)
        # tools/goi.mjs dùng chung cho GitHub Pages, Vercel và bài chơi thử. Bản gói có chuyện thì thêm "GOI: 0" vào env của bước này:
        # chép từng tệp như trước 20/11/2026.
        run: node tools/goi.mjs _site
        env:
          V: ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
