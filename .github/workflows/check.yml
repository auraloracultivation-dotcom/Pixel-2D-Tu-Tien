name: Kiểm tra
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
  choi-thu:
    # Người mới chơi thử 150 giây với Tự hành, giả ngày Lễ Bí Ngô: bắt lỗi JavaScript và truyện bị kẹt (tools/playtest.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      # Chơi thử trên đúng bản sẽ đưa lên (đã gói bằng tools/goi.mjs như .github/workflows/pages.yml), không phải mã nguồn rời
      - run: npm i --no-save esbuild@0.28.2 || echo "không cài được esbuild: chơi thử bản chưa gói"
      - run: node tools/goi.mjs _site
      - run: node ../tools/playtest.mjs
        working-directory: _site
