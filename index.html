<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#9fd8f0">
  <title>Pixel 2D Tu Tiên</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div class="bars">
      <div class="realm" id="realm"></div>
      <div class="bar hp"><i id="hp-fill"></i><span id="hp-text"></span></div>
      <div class="bar qi"><i id="qi-fill"></i><span id="qi-text"></span></div>
    </div>
    <div class="goal" id="goal"></div>
    <div class="boss" id="boss" hidden><span id="boss-name"></span><div class="bar"><i id="boss-fill"></i></div></div>
  </div>

  <div id="buttons" hidden>
    <button class="btn act" id="btn-act" data-act="act" hidden></button>
    <button class="btn skill" id="btn-s0" data-act="s0"><span class="cd"></span><b></b></button>
    <button class="btn skill" id="btn-s1" data-act="s1"><span class="cd"></span><b></b></button>
    <button class="btn skill" id="btn-s2" data-act="s2"><span class="cd"></span><b></b></button>
    <button class="btn atk" id="btn-atk" data-act="atk"><b>Đánh</b></button>
  </div>

  <div id="dialog" hidden>
    <div class="who" id="dlg-who"></div>
    <div class="text" id="dlg-text"></div>
    <div class="choices" id="dlg-choices"></div>
    <div class="hint" id="dlg-hint">Chạm để tiếp ▸</div>
  </div>

  <div id="toast" hidden></div>
  <div id="fly" hidden><div class="cloud"></div><div class="fly-text" id="fly-text"></div></div>

  <div id="menu" hidden>
    <h1>Pixel 2D Tu Tiên</h1>
    <p class="sub">Bản chơi tạm · hình khối đơn giản</p>
    <button class="menu-btn" id="menu-continue" hidden>Chơi tiếp</button>
    <button class="menu-btn" id="menu-new">Bắt đầu</button>
    <p class="help">Kéo nửa trái màn hình để đi. Bàn phím: WASD đi, J đánh, K L I chiêu, E tương tác.</p>
  </div>

  <div id="loading">Đang tải...</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
